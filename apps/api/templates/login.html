<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · AIZIX</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      .auth-wrap { max-width: 420px; margin: 4rem auto; padding: 2rem; }
      .auth-wrap h1 { margin-top: 0; font-weight: 600; }
      .auth-field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
      .auth-field input { padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
      .auth-actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
      .auth-error { color: #f87171; font-size: 0.875rem; min-height: 1.25rem; }
    </style>
  </head>
  <body style="margin:0;min-height:100vh;background:#060816;color:#e2e8f0;font-family:system-ui,sans-serif">
    <div class="auth-wrap card">
      <h1>Sign in</h1>
      <p class="muted tiny">Use your AIZIX account. Demo mode can skip login when REQUIRE_AUTH=false.</p>
      <div class="auth-field">
        <label class="muted tiny" for="email">Email</label>
        <input id="email" type="email" autocomplete="username" />
      </div>
      <div class="auth-field">
        <label class="muted tiny" for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <div class="auth-error" id="err"></div>
      <div class="auth-actions">
        <button type="button" class="btn btn-secondary" id="btn-login">Sign in</button>
        <a class="muted tiny" href="/signup">Create account</a>
        <a class="muted tiny" href="/">← Console</a>
      </div>
    </div>
    <script>
      const err = document.getElementById("err");
      function extractErrorMessage(e) {
        const maybeDetail = e?.detail;
        if (typeof maybeDetail === "string" && maybeDetail.trim()) return maybeDetail;
        if (Array.isArray(maybeDetail) && maybeDetail.length) {
          const first = maybeDetail[0];
          if (typeof first === "string") return first;
          if (first && typeof first === "object") {
            const msg = first.msg || first.message || first.detail;
            if (typeof msg === "string" && msg.trim()) return msg;
          }
          return "Sign in failed.";
        }
        if (typeof e?.message === "string" && e.message.trim()) return e.message;
        if (typeof e === "string" && e.trim()) return e;
        try {
          return JSON.stringify(e);
        } catch {
          return "Sign in failed.";
        }
      }
      document.getElementById("btn-login").addEventListener("click", async () => {
        err.textContent = "";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        try {
          const r = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            throw new Error(extractErrorMessage(data) || "Invalid credentials.");
          }
          localStorage.setItem("aizix_token", data.access_token);
          window.location.href = "/";
        } catch (e) {
          const msg =
            e?.response?.data?.detail ||
            e?.message ||
            (typeof e === "string" ? e : (() => { try { return JSON.stringify(e); } catch { return "Invalid credentials."; } })());
          err.textContent = msg;
        }
      });
    </script>
  </body>
</html>
