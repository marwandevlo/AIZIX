# Optional local PostgreSQL for AIZIX SaaS dev.
# Run: docker compose up -d
# Then set DATABASE_URL=postgresql+psycopg://aizix:aizix@127.0.0.1:5432/aizix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aizix
      POSTGRES_PASSWORD: aizix
      POSTGRES_DB: aizix
    ports:
      - "5432:5432"
    volumes:
      - aizix_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aizix -d aizix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aizix_pg_data:
